name: LOF Arbitrage Scanner

on:
  schedule:
    # 每5分钟运行，覆盖A股交易时段 (UTC 1:00-7:30 = 北京时间 9:00-15:30)
    - cron: '*/5 1-7 * * 1-5'
  workflow_dispatch:  # 允许在 GitHub 网页上手动触发

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run arbitrage scanner
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python main.py
